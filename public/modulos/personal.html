
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Personal</title>
    <link rel="stylesheet" href="../css/personalproveedores.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="../js/guard.js"></script>
</head>
<body>
    <p id="verificandoAcceso" role="status">Verificando acceso...</p>
    <div id="contenidoProtegido" hidden>

    <header class="encabezado">
        <h1>Gestion de Personal</h1>
        <p>Administracion de empleados de la empresa</p>
    </header>

    <main class="contenedor">

        <section class="panel">
            <h2>Registrar Personal</h2>

            <form id="personalForm" data-module="personal">

                <div class="grupo">
                    <label>Identidad</label>
                    <input type="text" name="identidad"
                        placeholder="Numero de identidad" required>
                </div>

                <div class="grupo">
                    <label>Nombres</label>
                    <input type="text" name="nombres"
                        placeholder="Ingrese los nombres" required>
                </div>

                <div class="grupo">
                    <label>Apellidos</label>
                    <input type="text" name="apellidos"
                        placeholder="Ingrese los apellidos" required>
                </div>

                <div class="grupo">
                    <label>Genero</label>
                    <select name="genero" required>
                        <option value="">Seleccione</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="grupo">
                    <label>Telefono</label>
                    <input type="tel" name="telefono"
                        placeholder="Numero de telefono" required>
                </div>

                <div class="grupo">
                    <label>Direccion</label>
                    <input type="text" name="direccion"
                        placeholder="Direccion del empleado" required>
                </div>

                <button type="submit">Guardar Personal</button>

            </form>
        </section>

        <section class="panel">
            <h2>Lista de Personal</h2>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Identidad</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Genero</th>
                            <th>Telefono</th>
                            <th>Direccion</th>
                        </tr>
                    </thead>

                    <tbody id="personalTabla">
                    </tbody>
                </table>
            </div>
        </section>

        <a href="../inventario.html" class="volver">Volver al panel</a>

    </main>


    </div>
</body>
</html>
